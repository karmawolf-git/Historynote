<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HistoryNote — HCP 관심사·성향 태깅</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-logo">📋</span>
      <div>
        <h1>HistoryNote</h1>
        <p class="brand-sub">HCP 관심사·성향 태깅 미니 CRM</p>
      </div>
    </div>
    <div class="header-actions">
      <input type="search" id="search-input" placeholder="이름·병원·과·키워드 검색" />
      <button id="btn-add-hcp" class="btn btn-primary">+ 의사 추가</button>
      <button id="btn-settings" class="btn" title="AI 설정">⚙️ 설정</button>
      <button id="btn-export" class="btn" title="JSON 내보내기">내보내기</button>
      <button id="btn-import" class="btn" title="JSON 가져오기">가져오기</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden />
    </div>
  </header>

  <main class="layout">
    <!-- 병원 > 과 > 교수 트리 -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- 상세 패널 -->
    <section class="detail" id="detail"></section>
  </main>

  <!-- 의사 추가/수정 모달 -->
  <dialog id="hcp-dialog">
    <form method="dialog" id="hcp-form">
      <h2 id="hcp-dialog-title">의사 추가</h2>
      <label>이름 *<input name="name" required placeholder="예: 김민준" /></label>
      <label>병원 *<input name="hospital" required list="hospital-list" placeholder="예: 서울중앙병원" /></label>
      <datalist id="hospital-list"></datalist>
      <label>진료과 *<input name="department" required list="department-list" placeholder="예: 내분비내과" /></label>
      <datalist id="department-list"></datalist>
      <label>직책
        <select name="title">
          <option>교수</option>
          <option>부교수</option>
          <option>조교수</option>
          <option>임상교수</option>
          <option>전임의</option>
          <option>과장</option>
          <option>원장</option>
          <option>봉직의</option>
        </select>
      </label>
      <label>비고<input name="memo" placeholder="예: 외래 화/목 오전" /></label>
      <div class="dialog-actions">
        <button type="button" class="btn" id="hcp-cancel">취소</button>
        <button type="submit" class="btn btn-primary">저장</button>
      </div>
    </form>
  </dialog>

  <!-- 설정 모달 -->
  <dialog id="settings-dialog">
    <form method="dialog" id="settings-form">
      <h2>AI 설정</h2>
      <p class="hint">
        Anthropic API 키를 입력하면 메모 분석과 성향 요약에 Claude AI를 사용합니다.
        키가 없어도 내장 키워드 사전으로 자동 태깅이 동작합니다.<br />
        키는 이 브라우저(localStorage)에만 저장되며 외부로 전송되지 않습니다.
      </p>
      <label>Anthropic API 키
        <input name="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off" />
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn" id="settings-cancel">취소</button>
        <button type="submit" class="btn btn-primary">저장</button>
      </div>
    </form>
  </dialog>

  <script src="js/dictionary.js"></script>
  <script src="js/store.js"></script>
  <script src="js/tagger.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
